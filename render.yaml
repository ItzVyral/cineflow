# Blueprint Render : Dashboard Render > New > Blueprint > choisir ce dépôt.
# Les valeurs marquées « sync: false » sont demandées à la création.
# Les données sont dans Supabase (DATABASE_URL) : aucun disque n'est nécessaire.
services:
  - type: web
    name: cineflow
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Render est un reverse proxy de confiance (HTTPS, IP du visiteur)
      - key: TRUST_PROXY
        value: "1"
      # Supabase > Connect > Session pooler
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: HEIWA_CLE
        sync: false
      - key: HEIWA_SITE
        sync: false
      - key: HEIWA_SANS_PUB
        value: "0"
      - key: TMDB_KEY
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      # https://<ton-service>.onrender.com/auth/discord/callback
      - key: DISCORD_REDIRECT_URI
        sync: false
      # Invitation du serveur Discord (pied de page)
      - key: DISCORD_SERVER_LINK
        value: https://discord.gg/Yc2RT8TKFq
